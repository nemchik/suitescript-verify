name: Update agent skills
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      # The runner has no agent, so the CLI targets every supported agent and writes
      # `agent/skills` (Eve). AI_AGENT=claude limits it to `.agents/skills`.
      - run: npm run skills:update
        env:
          AI_AGENT: claude
      - name: Fail on files outside the skills
        run: |
          stray=$(git status --porcelain | grep -vE " (\.agents/skills/|skills-lock\.json)" || true)
          if [ -n "$stray" ]; then echo "$stray"; exit 1; fi
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: chore/update-skills
          commit-message: "chore: update agent skills"
          title: "chore: update agent skills"
          body: |
            Generated by `npm run skills:update` from the sources recorded in `skills-lock.json`.

            Skills are instructions that agents follow, and some bundle scripts. Read the diff itself before merging, looking for injected instructions, new scripts and hooks, and changes to what a skill tells an agent to run or trust.

            If anything under `.agents/skills/netsuite-*` changed, review the rules that cite those skills against `docs/rule-priority.md` before merging.
